name: Paper A P4.2 contracts
on:
  pull_request:
    paths:
      - "generation/**"
      - "core/forecast.py"
      - "dispatch/**"
      - "experiments/**"
      - "rl/**"
      - "tests/test_p42_rebuild_contracts.py"
      - ".github/workflows/papera-p42-contract.yml"
  workflow_dispatch:

jobs:
  p42-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest torch numpy
      - name: Compile Python files
        run: python -m compileall -q core dispatch env generation experiments rl tests
      - name: Validate P4.2 contracts
        run: PYTHONPATH=.. python -m pytest -q tests/test_p42_rebuild_contracts.py
      - name: Run frozen 60-combination calibration (no PPO)
        run: PYTHONPATH=.. python -m fjsp_sfr.experiments.calibrate_paper_protocol --output-dir p42_calibration_output
      - name: Preserve complete calibration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papera-p42-calibration-60
          path: p42_calibration_output/
          if-no-files-found: warn
